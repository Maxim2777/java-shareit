version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shareit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  shareit-server:
    build: ./server  # Собираем из папки server
    container_name: shareit-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shareit
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shareit
    ports:
      - "9090:9090"
    restart: always

  shareit-gateway:
    build: ./gateway  # Собираем из папки gateway
    container_name: shareit-gateway
    depends_on:
      - shareit-server
    environment:
      SERVER_URL: http://shareit-server:9090
    ports:
      - "8080:8080"
    restart: always

volumes:
  postgres_data: